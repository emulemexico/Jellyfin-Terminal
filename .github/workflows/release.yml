name: Validate Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Validate manifest.json integrity
        run: |
          python3 -c "
          import json, sys
          manifest = json.load(open('manifest.json', encoding='utf-8'))
          assert len(manifest) > 0, 'Manifest cannot be empty'
          plugin = manifest[0]
          assert plugin['guid'] == 'a5e4d291-7643-41bb-b892-91e84fc5711b', 'GUID mismatch'
          assert len(plugin['versions']) > 0, 'No versions found'
          latest = plugin['versions'][0]
          print(f'Latest manifest version: {latest[\"version\"]}')
          print(f'Source URL: {latest[\"sourceUrl\"]}')
          print(f'Checksum: {latest[\"checksum\"]}')
          "
