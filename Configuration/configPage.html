<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Terminal</title>
</head>
<body>
<div id="terminalConfigurationPage"
     data-role="page"
     class="page type-interior pluginConfigurationPage"
     data-require="emby-button,emby-input">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />

    <style>
        .terminal-wrapper {
            margin-top: 1em;
            display: flex;
            flex-direction: column;
            background: #0d1117;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: #161b22;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .terminal-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95em;
            font-weight: 600;
            color: #c9d1d9;
        }
        .terminal-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f85149;
            display: inline-block;
            transition: background-color 0.2s ease;
        }
        .terminal-status-dot.connected {
            background-color: #3fb950;
        }
        .terminal-actions {
            display: flex;
            gap: 8px;
        }
        .term-btn {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #c9d1d9 !important;
            border-radius: 4px !important;
            padding: 4px 10px !important;
            font-size: 0.85em !important;
            cursor: pointer !important;
            transition: background 0.15s ease !important;
        }
        .term-btn:hover {
            background: rgba(255, 255, 255, 0.18) !important;
            color: #fff !important;
        }
        #terminalBox {
            height: calc(100vh - 280px);
            min-height: 440px;
            padding: 8px;
            box-sizing: border-box;
            background-color: #0d1117;
            cursor: text;
        }
        #terminalBox .xterm-viewport {
            overflow-y: auto !important;
        }
    </style>

    <div data-role="content">
        <div class="content-primary">
            <h2>Terminal del Servidor</h2>
            <p class="fieldDescription">Terminal interactiva para ejecutar comandos en el sistema operativo del host de Jellyfin.</p>

            <div class="terminal-wrapper">
                <div class="terminal-header">
                    <div class="terminal-header-title">
                        <span id="termStatusDot" class="terminal-status-dot"></span>
                        <span id="termStatusText">Desconectado</span>
                    </div>
                    <div class="terminal-actions">
                        <button id="btnReconnect" class="term-btn" type="button">Reiniciar Sesión</button>
                        <button id="btnClear" class="term-btn" type="button">Limpiar</button>
                    </div>
                </div>
                <div id="terminalBox"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>

    <script>
    (function () {
        const page = document.querySelector('#terminalConfigurationPage');
        const $ = (sel) => page.querySelector(sel);

        let term = null;
        let fitAddon = null;
        let currentSessionId = null;

        let currentLine = '';
        let history = [];
        let historyIndex = -1;
        let isBusy = false;
        let currentCwd = '';
        let isWindowsHost = false;

        function updateStatus(connected, text) {
            const dot = $('#termStatusDot');
            const txt = $('#termStatusText');
            if (dot) {
                if (connected) dot.classList.add('connected');
                else dot.classList.remove('connected');
            }
            if (txt) {
                txt.textContent = text;
            }
        }

        function formatPrompt(cwd) {
            if (isWindowsHost) {
                return '\x1b[1;36m' + (cwd || 'C:\\') + '\x1b[0m> ';
            }
            return '\x1b[1;32mhost\x1b[0m:\x1b[1;34m' + (cwd || '~') + '\x1b[0m$ ';
        }

        function printPrompt() {
            if (term) {
                term.write(formatPrompt(currentCwd));
            }
        }

        function clearLineOnScreen() {
            while (currentLine.length > 0) {
                term.write('\b \b');
                currentLine = currentLine.slice(0, -1);
            }
        }

        function cleanup() {
            if (term) {
                try { term.dispose(); } catch (e) {}
                term = null;
            }
            fitAddon = null;
            currentLine = '';
            historyIndex = -1;
            isBusy = false;
        }

        async function executeCommand(cmdText) {
            if (isBusy) return;

            const trimmed = cmdText.trim();
            if (trimmed.toLowerCase() === 'clear' || trimmed.toLowerCase() === 'cls') {
                term.clear();
                printPrompt();
                return;
            }

            if (trimmed.length === 0) {
                printPrompt();
                return;
            }

            isBusy = true;
            const token = ApiClient.accessToken();
            const userId = ApiClient.getCurrentUserId();

            const execUrl = ApiClient.getUrl('Terminal/Execute', {
                sessionId: currentSessionId,
                api_key: token,
                userId: userId
            });

            try {
                const response = await fetch(execUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmdText })
                });

                if (!response.ok) {
                    term.writeln('\x1b[1;31m[Error HTTP: ' + response.status + ' ' + response.statusText + ']\x1b[0m');
                } else {
                    const res = await response.json();
                    if (res.cwd) {
                        currentCwd = res.cwd;
                    }

                    if (res.output && res.output.length > 0) {
                        const formatted = res.output.replace(/\r?\n/g, '\r\n');
                        term.write(formatted);
                        if (!formatted.endsWith('\r\n')) {
                            term.write('\r\n');
                        }
                    }

                    if (res.error && res.error.length > 0) {
                        const formattedErr = res.error.replace(/\r?\n/g, '\r\n');
                        term.write('\x1b[1;31m' + formattedErr + '\x1b[0m');
                        if (!formattedErr.endsWith('\r\n')) {
                            term.write('\r\n');
                        }
                    }
                }
            } catch (err) {
                term.writeln('\x1b[1;31m[Error de comunicación: ' + err.message + ']\x1b[0m');
            } finally {
                isBusy = false;
                printPrompt();
            }
        }

        async function initTerminal() {
            cleanup();

            const container = $('#terminalBox');
            if (!container) return;
            container.innerHTML = '';

            if (typeof Terminal === 'undefined') {
                updateStatus(false, 'Cargando xterm.js...');
                setTimeout(initTerminal, 250);
                return;
            }

            term = new Terminal({
                cursorBlink: true,
                fontSize: 14,
                fontFamily: 'Consolas, "Fira Code", "Courier New", monospace',
                theme: {
                    background: '#0d1117',
                    foreground: '#c9d1d9',
                    cursor: '#58a6ff',
                    selectionBackground: 'rgba(56, 139, 253, 0.4)'
                }
            });

            if (typeof FitAddon !== 'undefined' && FitAddon.FitAddon) {
                fitAddon = new FitAddon.FitAddon();
                term.loadAddon(fitAddon);
            }

            term.open(container);
            if (fitAddon) {
                try { fitAddon.fit(); } catch (e) {}
            }

            term.focus();
            container.addEventListener('click', function () {
                if (term) term.focus();
            });

            currentSessionId = 'term_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
            const token = ApiClient.accessToken();
            const userId = ApiClient.getCurrentUserId();

            updateStatus(false, 'Inicializando sesión...');

            // Manejo de eventos de teclado en la terminal
            term.onData(function (data) {
                if (isBusy) return;

                // Enter
                if (data === '\r') {
                    term.write('\r\n');
                    const toRun = currentLine;
                    if (toRun.trim().length > 0) {
                        history.push(toRun);
                        historyIndex = history.length;
                    }
                    currentLine = '';
                    executeCommand(toRun);
                    return;
                }

                // Backspace
                if (data === '\x7f' || data === '\b') {
                    if (currentLine.length > 0) {
                        currentLine = currentLine.slice(0, -1);
                        term.write('\b \b');
                    }
                    return;
                }

                // Ctrl + C
                if (data === '\x03') {
                    term.write('^C\r\n');
                    currentLine = '';
                    printPrompt();
                    return;
                }

                // Flecha Arriba (Historial anterior)
                if (data === '\x1b[A') {
                    if (history.length > 0 && historyIndex > 0) {
                        historyIndex--;
                        clearLineOnScreen();
                        currentLine = history[historyIndex];
                        term.write(currentLine);
                    }
                    return;
                }

                // Flecha Abajo (Historial siguiente)
                if (data === '\x1b[B') {
                    if (history.length > 0 && historyIndex < history.length - 1) {
                        historyIndex++;
                        clearLineOnScreen();
                        currentLine = history[historyIndex];
                        term.write(currentLine);
                    } else {
                        historyIndex = history.length;
                        clearLineOnScreen();
                    }
                    return;
                }

                // Caracteres imprimibles normales y Tab
                if (data >= ' ' || data === '\t') {
                    currentLine += data;
                    term.write(data);
                }
            });

            // Obtener información del servidor y directorio inicial
            const infoUrl = ApiClient.getUrl('Terminal/Info', {
                sessionId: currentSessionId,
                api_key: token,
                userId: userId
            });

            try {
                const infoRes = await fetch(infoUrl);
                if (infoRes.ok) {
                    const info = await infoRes.json();
                    currentCwd = info.cwd || '';
                    isWindowsHost = !!info.isWindows;

                    updateStatus(true, 'Conectado (' + (info.user || 'Admin') + ')');

                    term.writeln('\x1b[1;32m=== Terminal del Servidor Jellyfin ===\x1b[0m');
                    term.writeln('\x1b[90mHost: ' + info.os + ' | Usuario: ' + info.user + '\x1b[0m\r\n');
                    printPrompt();
                } else {
                    updateStatus(false, 'Acceso Denegado (HTTP ' + infoRes.status + ')');
                    term.writeln('\x1b[1;31m[Acceso denegado: se requieren permisos de administrador]\x1b[0m');
                }
            } catch (err) {
                updateStatus(false, 'Error de conexión');
                term.writeln('\x1b[1;31m[Error al conectar con el servidor: ' + err.message + ']\x1b[0m');
            }
        }

        $('#btnReconnect').addEventListener('click', function () {
            initTerminal();
        });

        $('#btnClear').addEventListener('click', function () {
            if (term) {
                term.clear();
                printPrompt();
                term.focus();
            }
        });

        window.addEventListener('resize', function () {
            if (fitAddon) {
                try { fitAddon.fit(); } catch (e) {}
            }
        });

        page.addEventListener('pageshow', function () {
            setTimeout(initTerminal, 200);
        });

        page.addEventListener('viewhide', function () {
            cleanup();
        });

        setTimeout(initTerminal, 200);
    })();
    </script>
</div>
</body>
</html>
