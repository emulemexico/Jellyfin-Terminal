<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Terminal</title>
</head>
<body>
<div id="terminalConfigurationPage"
     data-role="page"
     class="page type-interior pluginConfigurationPage"
     data-require="emby-button,emby-input">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />

    <style>
        .terminal-wrapper {
            margin-top: 1em;
            display: flex;
            flex-direction: column;
            background: #0d1117;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: #161b22;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .terminal-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95em;
            font-weight: 600;
            color: #c9d1d9;
        }
        .terminal-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f85149;
            display: inline-block;
            transition: background-color 0.2s ease;
        }
        .terminal-status-dot.connected {
            background-color: #3fb950;
        }
        .terminal-actions {
            display: flex;
            gap: 8px;
        }
        .term-btn {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #c9d1d9 !important;
            border-radius: 4px !important;
            padding: 4px 10px !important;
            font-size: 0.85em !important;
            cursor: pointer !important;
            transition: background 0.15s ease !important;
        }
        .term-btn:hover {
            background: rgba(255, 255, 255, 0.18) !important;
            color: #fff !important;
        }
        #terminalBox {
            height: calc(100vh - 280px);
            min-height: 440px;
            padding: 8px;
            box-sizing: border-box;
            background-color: #0d1117;
        }
        #terminalBox .xterm-viewport {
            overflow-y: auto !important;
        }
    </style>

    <div data-role="content">
        <div class="content-primary">
            <h2>Terminal del Servidor</h2>
            <p class="fieldDescription">Terminal interactiva para ejecutar comandos en el sistema operativo del host de Jellyfin.</p>

            <div class="terminal-wrapper">
                <div class="terminal-header">
                    <div class="terminal-header-title">
                        <span id="termStatusDot" class="terminal-status-dot"></span>
                        <span id="termStatusText">Desconectado</span>
                    </div>
                    <div class="terminal-actions">
                        <button id="btnReconnect" class="term-btn" type="button">Reconectar</button>
                        <button id="btnClear" class="term-btn" type="button">Limpiar</button>
                    </div>
                </div>
                <div id="terminalBox"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>

    <script>
    (function () {
        const page = document.querySelector('#terminalConfigurationPage');
        const $ = (sel) => page.querySelector(sel);

        let term = null;
        let fitAddon = null;
        let abortController = null;
        let currentSessionId = null;

        function updateStatus(connected, text) {
            const dot = $('#termStatusDot');
            const txt = $('#termStatusText');
            if (dot) {
                if (connected) dot.classList.add('connected');
                else dot.classList.remove('connected');
            }
            if (txt) {
                txt.textContent = text;
            }
        }

        function cleanup() {
            if (abortController) {
                try { abortController.abort(); } catch (e) {}
                abortController = null;
            }
            if (currentSessionId) {
                try {
                    const token = ApiClient.accessToken();
                    const userId = ApiClient.getCurrentUserId();
                    fetch(ApiClient.getUrl('Terminal/Close', {
                        sessionId: currentSessionId,
                        api_key: token,
                        userId: userId
                    }), { method: 'POST', keepalive: true }).catch(() => {});
                } catch (e) {}
                currentSessionId = null;
            }
            if (term) {
                try { term.dispose(); } catch (e) {}
                term = null;
            }
            fitAddon = null;
        }

        async function connectTerminal() {
            cleanup();

            const container = $('#terminalBox');
            if (!container) return;
            container.innerHTML = '';

            if (typeof Terminal === 'undefined') {
                updateStatus(false, 'Cargando xterm.js...');
                setTimeout(connectTerminal, 250);
                return;
            }

            term = new Terminal({
                cursorBlink: true,
                fontSize: 14,
                fontFamily: 'Consolas, "Fira Code", "Courier New", monospace',
                theme: {
                    background: '#0d1117',
                    foreground: '#c9d1d9',
                    cursor: '#58a6ff',
                    selectionBackground: 'rgba(56, 139, 253, 0.4)'
                }
            });

            if (typeof FitAddon !== 'undefined' && FitAddon.FitAddon) {
                fitAddon = new FitAddon.FitAddon();
                term.loadAddon(fitAddon);
            }

            term.open(container);
            if (fitAddon) {
                try { fitAddon.fit(); } catch (e) {}
            }

            currentSessionId = 'term_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
            const token = ApiClient.accessToken();
            const userId = ApiClient.getCurrentUserId();

            abortController = new AbortController();
            updateStatus(false, 'Conectando...');

            const streamUrl = ApiClient.getUrl('Terminal/Stream', {
                sessionId: currentSessionId,
                api_key: token,
                userId: userId
            });

            // Conectar el input del teclado
            term.onData(function (data) {
                if (!currentSessionId) return;
                const inputUrl = ApiClient.getUrl('Terminal/Input', {
                    sessionId: currentSessionId,
                    api_key: token,
                    userId: userId
                });
                fetch(inputUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: data })
                }).catch(function (err) {
                    console.error('[Terminal Input Error]', err);
                });
            });

            try {
                const response = await fetch(streamUrl, {
                    signal: abortController.signal
                });

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status + ' (' + response.statusText + ')');
                }

                updateStatus(true, 'Conectado');

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    if (value) {
                        term.write(decoder.decode(value));
                    }
                }

                updateStatus(false, 'Sesión finalizada');
                term.writeln('\r\n\x1b[1;33m[Sesión finalizada por el proceso host]\x1b[0m\r\n');
            } catch (err) {
                if (err.name === 'AbortError') return;
                console.error('[Terminal Stream Error]', err);
                updateStatus(false, 'Error de conexión');
                term.writeln('\r\n\x1b[1;31m[Error de conexión: ' + err.message + ']\x1b[0m\r\n');
            }
        }

        $('#btnReconnect').addEventListener('click', function () {
            connectTerminal();
        });

        $('#btnClear').addEventListener('click', function () {
            if (term) term.clear();
        });

        window.addEventListener('resize', function () {
            if (fitAddon) {
                try { fitAddon.fit(); } catch (e) {}
            }
        });

        page.addEventListener('pageshow', function () {
            setTimeout(connectTerminal, 200);
        });

        page.addEventListener('viewhide', function () {
            cleanup();
        });

        setTimeout(connectTerminal, 200);
    })();
    </script>
</div>
</body>
</html>
