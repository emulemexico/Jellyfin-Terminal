<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Terminal</title>
</head>
<body>
<div id="terminalConfigurationPage"
     data-role="page"
     class="page type-interior pluginConfigurationPage"
     data-require="emby-button,emby-input">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />

    <style>
        .terminal-wrapper {
            margin-top: 1em;
            display: flex;
            flex-direction: column;
            background: #0d1117;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: #161b22;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .terminal-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95em;
            font-weight: 600;
            color: #c9d1d9;
        }
        .terminal-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f85149;
            display: inline-block;
            transition: background-color 0.2s ease;
        }
        .terminal-status-dot.connected {
            background-color: #3fb950;
        }
        .terminal-actions {
            display: flex;
            gap: 8px;
        }
        .term-btn {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #c9d1d9 !important;
            border-radius: 4px !important;
            padding: 4px 10px !important;
            font-size: 0.85em !important;
            cursor: pointer !important;
            transition: background 0.15s ease !important;
        }
        .term-btn:hover {
            background: rgba(255, 255, 255, 0.18) !important;
            color: #fff !important;
        }
        #terminalBox {
            height: calc(100vh - 280px);
            min-height: 420px;
            padding: 8px;
            box-sizing: border-box;
            background-color: #0d1117;
        }
        #terminalBox .xterm-viewport {
            overflow-y: auto !important;
        }
    </style>

    <div data-role="content">
        <div class="content-primary">
            <h2>Terminal del Servidor</h2>
            <p class="fieldDescription">Terminal interactiva para ejecutar comandos en el sistema operativo del host de Jellyfin.</p>

            <div class="terminal-wrapper">
                <div class="terminal-header">
                    <div class="terminal-header-title">
                        <span id="termStatusDot" class="terminal-status-dot"></span>
                        <span id="termStatusText">Desconectado</span>
                    </div>
                    <div class="terminal-actions">
                        <button id="btnReconnect" class="term-btn" type="button">Reconectar</button>
                        <button id="btnClear" class="term-btn" type="button">Limpiar</button>
                    </div>
                </div>
                <div id="terminalBox"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>

    <script>
    (function () {
        const PLUGIN_ID = 'a5e4d291-7643-41bb-b892-91e84fc5711b';
        const page = document.querySelector('#terminalConfigurationPage');
        const $ = (sel) => page.querySelector(sel);

        let term = null;
        let fitAddon = null;
        let socket = null;
        let isConnecting = false;

        function updateStatus(connected, text) {
            const dot = $('#termStatusDot');
            const txt = $('#termStatusText');
            if (dot) {
                if (connected) dot.classList.add('connected');
                else dot.classList.remove('connected');
            }
            if (txt) {
                txt.textContent = text;
            }
        }

        function cleanup() {
            if (socket) {
                try {
                    socket.close();
                } catch (e) {}
                socket = null;
            }
            if (term) {
                try {
                    term.dispose();
                } catch (e) {}
                term = null;
            }
            fitAddon = null;
            isConnecting = false;
        }

        function connectTerminal() {
            cleanup();

            const container = $('#terminalBox');
            if (!container) return;
            container.innerHTML = '';

            term = new Terminal({
                cursorBlink: true,
                fontSize: 14,
                fontFamily: 'Consolas, "Fira Code", "Courier New", monospace',
                theme: {
                    background: '#0d1117',
                    foreground: '#c9d1d9',
                    cursor: '#58a6ff',
                    selectionBackground: 'rgba(56, 139, 253, 0.4)'
                }
            });

            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(container);
            fitAddon.fit();

            const token = ApiClient.accessToken();
            const userId = ApiClient.getCurrentUserId();

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            const wsUrl = `${protocol}//${host}/Terminal/Socket?api_key=${encodeURIComponent(token)}&userId=${encodeURIComponent(userId)}`;

            updateStatus(false, 'Conectando...');
            isConnecting = true;

            try {
                socket = new WebSocket(wsUrl);
                socket.binaryType = 'arraybuffer';

                socket.onopen = function () {
                    isConnecting = false;
                    updateStatus(true, 'Conectado');
                    term.writeln('\x1b[1;32m=== Sesión interactiva iniciada en el host ===\x1b[0m\r\n');
                };

                socket.onmessage = function (event) {
                    if (typeof event.data === 'string') {
                        term.write(event.data);
                    } else {
                        const decoder = new TextDecoder('utf-8');
                        term.write(decoder.decode(event.data));
                    }
                };

                socket.onerror = function () {
                    isConnecting = false;
                    updateStatus(false, 'Error de conexión');
                    term.writeln('\r\n\x1b[1;31m[Error de comunicación WebSocket]\x1b[0m\r\n');
                };

                socket.onclose = function () {
                    isConnecting = false;
                    updateStatus(false, 'Desconectado');
                    term.writeln('\r\n\x1b[1;33m[Sesión finalizada por el servidor]\x1b[0m\r\n');
                };

                term.onData(function (data) {
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(data);
                    }
                });
            } catch (err) {
                console.error(err);
                updateStatus(false, 'Error de inicio');
            }
        }

        $('#btnReconnect').addEventListener('click', function () {
            connectTerminal();
        });

        $('#btnClear').addEventListener('click', function () {
            if (term) term.clear();
        });

        window.addEventListener('resize', function () {
            if (fitAddon) {
                try { fitAddon.fit(); } catch (e) {}
            }
        });

        page.addEventListener('pageshow', function () {
            setTimeout(connectTerminal, 150);
        });

        page.addEventListener('viewhide', function () {
            cleanup();
        });

        // Inicio directo si ya está cargada la página
        setTimeout(connectTerminal, 150);
    })();
    </script>
</div>
</body>
</html>
